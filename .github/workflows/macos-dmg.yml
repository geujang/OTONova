name: Package macOS preview DMG
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dmg:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download previously validated app
        run: |
          mkdir -p dist
          curl --fail --location --retry 3 https://github.com/geujang/OTONova/releases/download/v1.0.1-macos-preview/OTONova-macOS-arm64-experimental.zip -o dist/preview.zip
          echo '48a29b2915d19504349967b9683f48d4f3e6db6cc1ce46be556ec6631159bd0e  dist/preview.zip' | shasum -a 256 -c -
          ditto -x -k dist/preview.zip dist
      - name: Create, mount and verify DMG
        run: python package_macos_dmg.py dist/OTONova.app dist/OTONova-macOS-arm64-experimental.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: OTONova-macOS-DMG
          path: |
            dist/*.dmg
            dist/OTONova-macOS-DMG-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 3
